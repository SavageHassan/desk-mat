<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Placeholder illustration of a desk mat in a workspace">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe8dd"/><stop offset="1" stop-color="#e2d7c7"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2b2822"/><stop offset="1" stop-color="#1b1915"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3730"/><stop offset="1" stop-color="#24211c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#wood)"/>
  <ellipse cx="520" cy="180" rx="760" ry="420" fill="url(#glow)"/>

  <!-- monitor -->
  <rect x="520" y="90" width="560" height="320" rx="10" fill="url(#screen)"/>
  <rect x="544" y="114" width="512" height="272" rx="4" fill="#15130f"/>
  <rect x="576" y="150" width="190" height="10" rx="5" fill="#a9693c" opacity="0.85"/>
  <rect x="576" y="180" width="330" height="8" rx="4" fill="#5c564c"/>
  <rect x="576" y="202" width="270" height="8" rx="4" fill="#45403a"/>
  <rect x="576" y="246" width="420" height="100" rx="6" fill="#211e1a"/>
  <rect x="760" y="410" width="80" height="46" fill="#2b2822"/>
  <rect x="690" y="452" width="220" height="14" rx="7" fill="#332f29"/>

  <!-- desk mat -->
  <g>
    <rect x="200" y="470" width="1200" height="520" rx="18" fill="#cfc4b4" opacity="0.5"/>
    <rect x="190" y="460" width="1200" height="520" rx="18" fill="url(#mat)"/>
    <rect x="212" y="482" width="1156" height="476" rx="10" fill="none" stroke="#6b6155" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 9"/>
    <rect x="190" y="460" width="1200" height="60" rx="18" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- keyboard -->
  <g transform="translate(360 600)">
    <rect x="0" y="0" width="620" height="210" rx="12" fill="#f4efe7"/>
    <rect x="0" y="0" width="620" height="210" rx="12" fill="none" stroke="#d9cfc0" stroke-width="2"/>
    <g fill="#e3dacd">
      <rect x="22" y="22" width="52" height="34" rx="6"/><rect x="86" y="22" width="52" height="34" rx="6"/>
      <rect x="150" y="22" width="52" height="34" rx="6"/><rect x="214" y="22" width="52" height="34" rx="6"/>
      <rect x="278" y="22" width="52" height="34" rx="6"/><rect x="342" y="22" width="52" height="34" rx="6"/>
      <rect x="406" y="22" width="52" height="34" rx="6"/><rect x="470" y="22" width="52" height="34" rx="6"/>
      <rect x="534" y="22" width="64" height="34" rx="6"/>
      <rect x="22" y="68" width="52" height="34" rx="6"/><rect x="86" y="68" width="52" height="34" rx="6"/>
      <rect x="150" y="68" width="52" height="34" rx="6"/><rect x="214" y="68" width="52" height="34" rx="6"/>
      <rect x="278" y="68" width="52" height="34" rx="6"/><rect x="342" y="68" width="52" height="34" rx="6"/>
      <rect x="406" y="68" width="52" height="34" rx="6"/><rect x="470" y="68" width="52" height="34" rx="6"/>
      <rect x="534" y="68" width="64" height="34" rx="6"/>
      <rect x="22" y="114" width="52" height="34" rx="6"/><rect x="86" y="114" width="52" height="34" rx="6"/>
      <rect x="150" y="114" width="52" height="34" rx="6"/><rect x="214" y="114" width="52" height="34" rx="6"/>
      <rect x="278" y="114" width="52" height="34" rx="6"/><rect x="342" y="114" width="52" height="34" rx="6"/>
      <rect x="406" y="114" width="52" height="34" rx="6"/><rect x="470" y="114" width="128" height="34" rx="6"/>
      <rect x="150" y="160" width="320" height="30" rx="6"/>
      <rect x="22" y="160" width="110" height="30" rx="6"/><rect x="488" y="160" width="110" height="30" rx="6"/>
    </g>
  </g>

  <!-- mouse -->
  <g transform="translate(1072 640)">
    <rect x="6" y="10" width="112" height="170" rx="56" fill="#cfc4b4" opacity="0.45"/>
    <rect x="0" y="0" width="112" height="170" rx="56" fill="#f4efe7" stroke="#d9cfc0" stroke-width="2"/>
    <line x1="56" y1="14" x2="56" y2="62" stroke="#d9cfc0" stroke-width="2"/>
    <rect x="49" y="26" width="14" height="30" rx="7" fill="#a9693c" opacity="0.8"/>
  </g>

  <!-- mug -->
  <g transform="translate(1180 430)">
    <circle cx="60" cy="60" r="60" fill="#f4efe7" stroke="#d9cfc0" stroke-width="2"/>
    <circle cx="60" cy="60" r="40" fill="#a9693c" opacity="0.65"/>
    <path d="M120 40 a30 30 0 0 1 0 44" fill="none" stroke="#d9cfc0" stroke-width="10"/>
  </g>

  <!-- notebook + pen -->
  <g transform="translate(230 540)">
    <rect x="0" y="0" width="92" height="300" rx="8" fill="#a9693c" opacity="0.9"/>
    <rect x="12" y="16" width="68" height="268" rx="4" fill="#f4efe7" opacity="0.35"/>
    <rect x="30" y="330" width="46" height="8" rx="4" fill="#f4efe7" opacity="0.5"/>
  </g>

  <!-- plant -->
  <g transform="translate(1340 150)">
    <path d="M110 300 C60 230 60 150 108 92" fill="none" stroke="#6f7a5c" stroke-width="10" stroke-linecap="round"/>
    <path d="M108 92 C150 40 196 36 214 48 C204 110 150 132 108 92Z" fill="#7d8a65"/>
    <path d="M112 170 C70 140 46 96 52 70 C104 80 132 128 112 170Z" fill="#6f7a5c"/>
    <path d="M70 300 h92 l-12 92 h-68Z" fill="#c9a07a"/>
  </g>
</svg>
